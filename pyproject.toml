[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safelens"
version = "0.1.0"
description = "Pluggable safety probing, monitoring, attribution, and FlagSafe adapter scaffolding."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "SafeLens Team" }
]
keywords = [
  "activation-patching",
  "ai-safety",
  "attribution",
  "hooks",
  "large-language-models",
  "llm-monitoring",
  "mechanistic-interpretability",
  "model-adapters",
  "safety-probing"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7"
]

[project.optional-dependencies]
attribution = [
  "captum>=0.9,<1",
  "matplotlib>=3.7",
  "numpy>=1.23",
  "torch>=2.3"
]
models = [
  "torch>=2",
  "transformers>=5.8"
]
nla = [
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
  "torch>=2",
  "transformers>=5.8"
]
modelscope = [
  "modelscope>=1.15",
  "torch>=2",
  "transformers>=5.8"
]
viz = [
  "circuitsvis>=1.43",
  "numpy>=1.23",
  "torch>=2"
]
explorer = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1"
]
dev = [
  "build>=1.2",
  "matplotlib>=3.7",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mypy>=1.8",
  "numpy>=1.23",
  "pre-commit>=3.6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5",
  "types-PyYAML>=6"
]

[project.urls]
Homepage = "https://github.com/PKU-PILLAR-Group/SafeLens"
Documentation = "https://pku-pillar-group.github.io/SafeLens/"
Repository = "https://github.com/PKU-PILLAR-Group/SafeLens"
Issues = "https://github.com/PKU-PILLAR-Group/SafeLens/issues"
Changelog = "https://github.com/PKU-PILLAR-Group/SafeLens/blob/main/CHANGELOG.md"

[project.scripts]
safelens = "SafeLens.cli:main"
safelens-explorer-chunks = "SafeLens.explorer_chunks:main"
safelens-explorer = "SafeLens.explorer_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
SafeLens = [
  "py.typed",
  "explorer_web/*",
  "explorer_web/assets/*",
  "explorer_workers/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests that touch external providers, real downloads, or deployed services",
  "slow: tests that load large models or take materially longer than unit tests"
]

[tool.coverage.run]
branch = true
source = ["SafeLens"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".conda", ".conda-pkgs", ".cache", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = false
